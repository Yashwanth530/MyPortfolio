    <!-- CONTACT FORM -->

    <section>

        <h2>CONTACT ME</h2>

        <form>

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
            >


            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >


            <label for="message">
                Message:
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Enter your message"
            ></textarea>


            <button type="submit">
                Submit
            </button>

        </form>

    </section>
